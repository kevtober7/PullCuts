for(const ev in EVENTS){EVENTS[ev].split(" ").forEach((k,i)=>{if(k==="-")return;if(!P[k])console.warn("missing",k);(W[k]=W[k]||[]).push({ev,y:1960+i})})}
for(const k in P)W[k]=W[k]||[];
const keys=Object.keys(P);
const won=k=>W[k].length>0;
const career=k=>W[k].length+(P[k][3]||0);
const set=f=>keys.filter(f);
function buildPool(){
  const pool=[];const add=(kind,q,sub,ans)=>{if(ans.length>=3)pool.push({kind,q,sub,ans})};
  const decades=[1960,1970,1980,1990,2000,2010,2020];
  for(const ev in EVENTS){
    add("event",`Name a winner of ${EVNAME[ev]}`,"Any year since 1960",set(k=>W[k].some(w=>w.ev===ev)));
    add("multi",`Name a player who won ${EVNAME[ev]} more than once`,"Since 1960",set(k=>W[k].filter(w=>w.ev===ev).length>1));
    add("intl",`Name a non-American who won ${EVNAME[ev]}`,"Since 1960",set(k=>P[k][1]!=="USA"&&W[k].some(w=>w.ev===ev)));
    add("only",`Name a player whose only major was ${EVNAME[ev]}`,"Exactly one career major",set(k=>career(k)===1&&W[k][0].ev===ev));
    for(const d of decades) add("evdec",`Name a ${EVSHORT[ev]} champion from the ${d}s`,`Won between ${d} and ${Math.min(d+9,2026)}`,set(k=>W[k].some(w=>w.ev===ev&&w.y>=d&&w.y<d+10)));
  }
  for(const d of decades) add("dec",`Name a player who won a major in the ${d}s`,`Any of the four majors, ${d}–${Math.min(d+9,2026)}`,set(k=>W[k].some(w=>w.y>=d&&w.y<d+10)));
  const evs=Object.keys(EVENTS);
  for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)add("pair",`Name a player who won both ${EVNAME[evs[i]]} and ${EVNAME[evs[j]]}`,"Career, any years",set(k=>W[k].some(w=>w.ev===evs[i])&&W[k].some(w=>w.ev===evs[j])));
  const countries=[...new Set(keys.filter(won).map(k=>P[k][1]))].filter(c=>c!=="USA");
  for(const c of countries)add("country",`Name a major champion from ${c}`,"Any major since 1960",set(k=>won(k)&&P[k][1]===c));
  add("count","Name a player with exactly one career major","Any of the four majors",set(k=>career(k)===1));
  add("count","Name a player with exactly two career majors","Any of the four majors",set(k=>career(k)===2));
  add("count","Name a player with 3 or 4 career majors","Any of the four majors",set(k=>career(k)>=3&&career(k)<=4));
  add("count","Name a player with 5 or more career majors","Any of the four majors",set(k=>career(k)>=5));
  add("b2b","Name a player who won the same major in back-to-back years","e.g. two straight U.S. Opens",set(k=>W[k].some(a=>W[k].some(b=>b.ev===a.ev&&b.y===a.y+1))));
  add("year","Name a player who won two majors in the same year","Since 1960",set(k=>W[k].some(a=>W[k].some(b=>b!==a&&b.y===a.y))));
  add("usopen-am","Name an American who won The Open Championship (British Open) since 1990","1990–2026",set(k=>P[k][1]==="USA"&&W[k].some(w=>w.ev==="open"&&w.y>=1990)));
  add("first","Name a player who won a major for the first time since 2015","First major came in 2015 or later",set(k=>won(k)&&Math.min(...W[k].map(w=>w.y))>=2015&&!P[k][3]));
  add("plus","Name a player who has won 2+ majors","Career total, any of the four majors",set(k=>career(k)>=2));
  add("plus","Name a player who has won 3+ majors","Career total, any of the four majors",set(k=>career(k)>=3));
  add("plus","Name a player who has won 4+ majors","Career total, any of the four majors",set(k=>career(k)>=4));
  add("sub60","Name a player who has shot a round in the 50s","59 or better in an official PGA Tour event",[...new Set(SUB60)]);
  add("players","Name a player who has won The Players Championship","1974–2026",[...new Set(PLAYERS.filter(k=>k!=="-"))]);
  add("no1","Name a player who has been No. 1 in the Official World Golf Ranking","Since the rankings began in 1986",[...NO1]);
  const distinct=k=>new Set(W[k].map(w=>w.ev)).size;
  add("slam","Name a player who has completed the Career Grand Slam","Won all four majors: the Masters, U.S. Open, The Open Championship (British Open) and PGA Championship",[...set(k=>distinct(k)===4),...SLAM_PRE]);
  add("slam","Name a player who is one major away from the Career Grand Slam","Has won three of the four different majors",[...set(k=>distinct(k)===3),...ONEAWAY_PRE]);
  for(let y=2000;y<=2026;y++)add("season",`Name a player who won a PGA Tour event in ${y}`,y>=2014&&y<=2023?`Official events in the ${y-1}–${String(y).slice(2)} season`:`Official events in the ${y} season`,TOURWINS[y].split(" "));
  return pool;
}
const POOL=buildPool();

// ---------- DAILY SEED ----------
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function pick7(seed){
  // Shuffle the question types, take 9, then pick a random question within each type
  const r=rng(hash(seed));const shuf=a=>a.map(x=>[r(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  const kinds=shuf([...new Set(POOL.map(q=>q.kind))]).slice(0,HOLES);
  return kinds.map(k=>{const qs=POOL.filter(q=>q.kind===k);return qs[Math.floor(r()*qs.length)]});
}
const now=new Date();
const pad=n=>String(n).padStart(2,"0");
const today=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const puzzleNo=Math.floor((Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())-Date.UTC(2026,9,22))/864e5)+1;
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

// ---------- NAME LOOKUP ----------
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z ]/g,"").trim();
const ALL=[...keys.map(k=>({k,name:P[k][0]})),...NOMAJOR.filter(n=>!keys.some(k=>norm(P[k][0])===norm(n))).map(n=>({k:null,name:n}))].map(o=>({...o,n:norm(o.name)}));
function search(q){const t=norm(q).split(/\s+/).filter(Boolean);if(!t.length)return[];
  return ALL.filter(o=>t.every(x=>o.n.split(" ").some(w=>w.startsWith(x))||o.n.includes(x))).slice(0,6)}

// ---------- GAME ----------
const TIME=35,HOLES=9;
const yards=k=>Math.round(120+(100-P[k][2])*2.6);
let G=null,timerId=null;
const $=s=>document.querySelector(s);
const app=$("#app");

function start(practice){
  const seed=practice?"practice-"+Math.random():today;
  G={practice,qs:pick7(seed),i:0,res:[]};
  setNav("play",true);renderHoles();askQ();
}
function renderHoles(){
  $("#meta").innerHTML=G&&G.practice?"Practice round":`No. ${puzzleNo}<br>${now.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}`;
  $("#holes").innerHTML=Array.from({length:HOLES},(_,i)=>{const r=G&&G.res[i];const cls=r?(r.k?"hit":"miss"):(G&&i===G.i&&G.i<HOLES?"now":"");return`<div class="hole ${cls}" aria-label="Hole ${i+1}">${r?(r.k?r.yds:"OB"):i+1}</div>`}).join("");
}
function askQ(){
  const q=G.qs[G.i];let left=TIME,sel=0,list=[];
  app.innerHTML=`<section class="card">
    <div class="eyebrow"><span>Hole ${G.i+1} of ${HOLES}</span><span id="clock">${TIME}s</span></div>
    <h2>${q.q}</h2><p class="sub">${q.sub}</p>
    <div class="timer" id="tbar"><i></i></div>
    <div class="field"><label for="guess" class="sr" hidden>Player name</label>
      <input type="text" id="guess" autocomplete="off" spellcheck="false" placeholder="Start typing a player…" aria-label="Player name">
      <ul class="sugg" id="sugg" role="listbox" hidden></ul></div>
    <p class="hint" id="hint">Guess until you find one that fits. Pick from the list.</p><p class="hint" id="tried"></p>
    <div class="row"><button id="skip" class="ghost">Give up</button></div></section>`;
  const inp=$("#guess"),ul=$("#sugg");inp.focus();
  const wrong=[];
  const tryName=o=>{if(o.k&&q.ans.includes(o.k))return answer(o,false,wrong.length);if(!wrong.includes(o.name))wrong.push(o.name);inp.value="";list=[];draw();$("#hint").innerHTML=`<span class="miss-t">${o.name} doesn't fit.</span> Keep guessing.`;$("#tried").textContent="Already tried: "+wrong.join(", ");inp.focus()};
  const draw=()=>{ul.hidden=!list.length;ul.innerHTML=list.map((o,i)=>`<li role="option" class="${i===sel?"on":""}" data-i="${i}"><span>${o.name}</span><small>${o.k?P[o.k][1]:""}</small></li>`).join("")};
  inp.addEventListener("input",()=>{list=search(inp.value);sel=0;draw();$("#hint").textContent=inp.value&&!list.length?"No player by that name in the list.":"Guess until you find one that fits. Pick from the list."});
  inp.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){sel=Math.min(sel+1,list.length-1);draw();e.preventDefault()}
    else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);draw();e.preventDefault()}
    else if(e.key==="Enter"&&list[sel]){tryName(list[sel])}
  });
  ul.addEventListener("mousedown",e=>{const li=e.target.closest("li");if(li){e.preventDefault();tryName(list[+li.dataset.i])}});
  $("#skip").onclick=()=>answer(null);
  const t0=Date.now();
  timerId=setInterval(()=>{left=Math.max(0,TIME-(Date.now()-t0)/1000);$("#tbar i").style.width=(left/TIME*100)+"%";$("#tbar").classList.toggle("low",left<8);$("#clock").textContent=Math.ceil(left)+"s";if(left<=0)answer(null,true)},100);
}
function answer(o,timeout,misses){
  clearInterval(timerId);
  const q=G.qs[G.i];const ok=o&&o.k&&q.ans.includes(o.k);
  const r={q:q.q,pick:o?o.name:null,k:ok?o.k:null,yds:ok?yards(o.k):0};
  G.res.push(r);G.i++;renderHoles();
  const deep=[...q.ans].sort((a,b)=>P[a][2]-P[b][2]);
  const top=[...q.ans].sort((a,b)=>P[b][2]-P[a][2])[0];
  const best=deep[0];
  let verdict,pill="";
  if(ok){const f=P[o.k][2];verdict=f<=15?"Deep cut. Right down the middle.":f<=40?"Solid drive.":f<=70?"In the fairway.":"Safe play, short off the tee.";if(o.k===best)pill='<span class="pill">Deepest possible</span>'}
  else verdict=timeout?"Time ran out. Out of bounds.":o?`${o.name} doesn't fit. Out of bounds.`:"Out of bounds.";
  if(ok&&misses)verdict+=` Took ${misses+1} tries.`;
  app.innerHTML=`<section class="card">
    <div class="eyebrow"><span>Hole ${G.i} of ${HOLES}</span><span>${q.ans.length} valid answers</span></div>
    <h2>${q.q}</h2>
    <div class="result"><div class="yds ${ok?"":"ob"}">${ok?r.yds:"OB"}${ok?"<small>yds</small>":""}</div>${pill}</div>
    <p class="verdict">${verdict}</p>
    <p class="reveal">Deepest cuts: <b>${deep.slice(0,3).map(k=>`${P[k][0]} (${yards(k)})`).join(", ")}</b>.<br>Most obvious: <b>${P[top][0]} (${yards(top)})</b>.</p>
    <div class="row"><button id="next">${G.i<HOLES?"Next hole":"See scorecard"}</button></div></section>`;
  $("#next").focus();
  $("#next").onclick=()=>{if(G.i<HOLES)askQ();else finish()};
}
function finish(){
  if(!G.practice){store.set("dr9-"+today,G.res);postRound(G.res)}
  setNav("play",false);
  scorecard(G.res,G.practice);
}
const total=res=>res.reduce((a,r)=>a+r.yds,0);
function shareText(res){
  const sq=res.map(r=>!r.k?"🟥":r.yds>=300?"🟩":r.yds>=200?"🟨":"⬜").join("");
  return `PullCuts #${puzzleNo} ⛳ ${total(res).toLocaleString()} yds\n${sq}`;
}

  app.innerHTML=`<section class="card">
    <div class="eyebrow"><span>${practice?"Practice round":"Today's round"}</span><span>${hits}/${HOLES} in play</span></div>

    </tbody><tfoot><tr><td></td><td>Total</td><td class="n">${total(res).toLocaleString()}</td></tr></tfoot></table></div>

  if(!practice)$("#copy").onclick=()=>{const t=shareText(res);navigator.clipboard.writeText(t).then(()=>$("#cmsg").textContent="Copied. Paste it in the group chat.").catch(()=>{const r=document.createRange();r.selectNodeContents($("#share"));const s=getSelection();s.removeAllRanges();s.addRange(r);$("#cmsg").textContent="Copy blocked here. The text is selected, so copy it yourself."})};

function intro(){
  G=null;setNav("play",false);renderHoles();
  if(UID&&!me.name)return askName(false);

  app.innerHTML=`<section class="card">

    <div class="row"><button id="go">Tee off</button>${UID?"":'<button class="ghost signin">Sign in with Google</button>'}</div>${UID?"":'<p class="note">Sign in to post your score to the leaderboard. You can also play without signing in.</p>'}</section>`;

// ---------- PLAYERS & LEADERBOARD (Firebase) ----------
// Each player's doc lives at players/<uid>: {name, rounds:{"YYYY-MM-DD":{yds,hits,holes,picks}}, updated}
const NAME_KEY="pc-name";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const me={name:store.get(NAME_KEY)||""};
let UID=null,BOARD=[],online="loading",postErr=null,signErr="",view="play",boardMode="today",unsub=null;
const FB=()=>window.PCFB||null;

function setNav(v,busy){
  view=v;$("#nPlay").classList.toggle("on",v==="play");$("#nBoard").classList.toggle("on",v==="board");
  if(busy!==undefined){$("#nBoard").disabled=busy;setNav.busy=busy}

  $("#who").innerHTML=UID
    ?`Playing as <b>${esc(me.name||"…")}</b> · <button class="linkbtn" id="rename">Change</button> · <button class="linkbtn" id="signout">Sign out</button>`
    :`<button class="linkbtn signin">Sign in with Google</button>`;
  const rn=$("#rename");if(rn){rn.disabled=!!b;rn.onclick=()=>askName(true)}

$("#nPlay").onclick=()=>intro();
$("#nBoard").onclick=()=>showBoard();
document.addEventListener("click",e=>{if(e.target.closest(".signin"))doSignIn()});
async function doSignIn(){
  const f=FB();
  if(!f){signErr="Sign-in is still loading. Try again in a few seconds.";refreshBoard();return}
  try{signErr="";await f.signIn()}
  catch(e){const c=e&&e.code||"";if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")return;
    signErr="Sign-in didn't work"+(c?` (${c})`:"")+". Try again, or try a different browser.";refreshBoard();const h=$("#signmsg");if(h)h.textContent=signErr}
}

function askName(changing){
  setNav("play",false);$("#holes").hidden=true;
  app.innerHTML=`<section class="card">
    <div class="eyebrow"><span>${changing?"Change your name":"Welcome to PullCuts"}</span></div>
    <h2>${changing?"What should we call you?":"Pick a name for the leaderboard"}</h2>
    <p class="how">This is how other players will see you next to your score.</p>
    <form id="nameForm" class="row" style="align-items:stretch">
      <input type="text" id="uname" maxlength="20" autocomplete="nickname" placeholder="Your name" aria-label="Your name" value="${esc(me.name)}" style="flex:1;min-width:0">
      <button type="submit">Save</button>

async function postRound(res){
  const f=FB();if(!f||!UID||!me.name)return;
  const round={yds:total(res),hits:res.filter(r=>r.k).length,holes:res.map(r=>r.yds),picks:res.map(r=>r.pick)};
  try{await f.postRound(UID,me.name,today,round);postErr=null}catch(e){postErr=e&&e.code||"error"}
  refreshBoard();
}
function showBoard(){
  setNav("board");
  app.innerHTML=`<section class="card">
    <div class="eyebrow"><span>Leaderboard</span><span>${boardMode==="today"?"No. "+puzzleNo:"All rounds"}</span></div>
    <div class="seg"><button class="tab ${boardMode==="today"?"on":""}" id="mToday">Today</button><button class="tab ${boardMode==="all"?"on":""}" id="mAll">All-time</button></div>
    <div id="lb" data-mode="${boardMode}"></div></section>`;
  $("#mToday").onclick=()=>{boardMode="today";showBoard()};
  $("#mAll").onclick=()=>{boardMode="all";showBoard()};

function refreshBoard(){
  const el=$("#lb");if(!el)return;const mode=el.dataset.mode;
  if(online==="loading"){el.innerHTML='<p class="note">Loading the leaderboard…</p>';return}
  if(online==="off"){el.innerHTML='<p class="note">The leaderboard can\'t load right now. Check your connection and refresh the page. You can still play.</p>';return}
  if(online==="signedout"){el.innerHTML=`<p class="note">Sign in with Google to see the leaderboard and post your scores.</p><div class="row"><button class="signin">Sign in with Google</button></div><p class="hint miss-t" id="signmsg">${esc(signErr)}</p>`;return}
  const warn=postErr?`<p class="note miss-t">Your score couldn't be posted (${esc(postErr)}). Refresh the page and try again.</p>`:"";
  let rows;
  if(mode==="today"){
    rows=BOARD.filter(p=>p.rounds&&p.rounds[today]).map(p=>({id:p.id,name:p.name,a:p.rounds[today].hits+"/"+HOLES,v:p.rounds[today].yds})).sort((a,b)=>b.v-a.v);
    if(!rows.length){el.innerHTML=warn+'<p class="note">No one has finished today\'s round yet. Finish yours to take the top spot.</p>';return}
    el.innerHTML=warn+table(rows,"In play","Yds");
  }else{
    rows=BOARD.map(p=>{const r=Object.values(p.rounds||{});return{id:p.id,name:p.name,a:r.length,v:r.reduce((s,x)=>s+(x.yds||0),0)}}).filter(p=>p.a>0).sort((a,b)=>b.v-a.v);
    if(!rows.length){el.innerHTML=warn+'<p class="note">No rounds posted yet.</p>';return}
    el.innerHTML=warn+table(rows,"Rounds","Total yds");
  }
}
function table(rows,aLabel,vLabel){
  return `<div style="overflow-x:auto"><table class="lb"><thead><tr><th>#</th><th>Player</th><th class="n">${aLabel}</th><th class="n">${vLabel}</th></tr></thead><tbody>${
    rows.map((r,i)=>`<tr class="${r.id===UID?"you":""}"><td class="rk">${i+1}</td><td>${esc(r.name||"Player")}${r.id===UID?'<span class="youtag">You</span>':""}</td><td class="n">${r.a}</td><td class="n">${r.v.toLocaleString()}</td></tr>`).join("")
  }</tbody></table></div>`;
}
// Called by the Firebase module whenever someone signs in or out
window.pcAuth=async u=>{
  if(unsub){unsub();unsub=null}
  const midRound=G&&G.i<HOLES;
  if(!u){UID=null;BOARD=[];online="signedout";setNav(view);refreshBoard();if(!midRound&&view==="play")intro();return}
  UID=u.uid;const f=FB();
  try{
    const d=await f.getMine(UID);
    if(d&&d.name){me.name=d.name;store.set(NAME_KEY,d.name)}
    const r=d&&d.rounds&&d.rounds[today];
    const local=store.get("dr9-"+today);
    if(r&&!local){
      const qs=pick7(today);
      store.set("dr9-"+today,qs.map((q,i)=>({q:q.q,pick:r.picks[i],k:r.holes[i]>0?1:null,yds:r.holes[i]})));
    }
    if(!d&&me.name)await f.saveName(UID,me.name);
    if(!r&&local&&me.name)await postRound(local);
  }catch(e){postErr=e&&e.code||"error"}
  online="on";
  unsub=f.watch(list=>{BOARD=list;refreshBoard()},()=>{online="off";refreshBoard()});
  setNav(view);
  if(!midRound){if(view==="board")showBoard();else intro()}
};
setTimeout(()=>{if(online==="loading"){online="off";refreshBoard()}},15000);
intro();

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,onSnapshot,collection,FieldPath,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({
  apiKey:"AIzaSyD4l_PeLLv69vJefLe38t4K-dgTwO-5Sho",
  authDomain:"deepullcuts.firebaseapp.com",
  projectId:"deepullcuts",
  storageBucket:"deepullcuts.firebasestorage.app",
  messagingSenderId:"962795305020",
  appId:"1:962795305020:web:dc6e6f4e24c4b862952b39"
});
const auth=getAuth(app),db=getFirestore(app);
window.PCFB={
  async signIn(){const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
    try{await signInWithPopup(auth,p)}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-environment")await signInWithRedirect(auth,p);else throw e}},
  signOut:()=>signOut(auth),
  async getMine(uid){const s=await getDoc(doc(db,"players",uid));return s.exists()?s.data():null},
  async saveName(uid,name){const r=doc(db,"players",uid);const s=await getDoc(r);
    if(s.exists())await updateDoc(r,{name,updated:serverTimestamp()});else await setDoc(r,{name,rounds:{},updated:serverTimestamp()})},
  async postRound(uid,name,day,round){const r=doc(db,"players",uid);const s=await getDoc(r);
    if(!s.exists()){await setDoc(r,{name,rounds:{[day]:round},updated:serverTimestamp()});return}
    if((s.data().rounds||{})[day])return;
    await updateDoc(r,new FieldPath("rounds",day),round,"updated",serverTimestamp())},
  watch:(cb,err)=>onSnapshot(collection(db,"players"),s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),err)
};
onAuthStateChanged(auth,u=>{if(window.pcAuth)window.pcAuth(u?{uid:u.uid}:null)});
</script>
